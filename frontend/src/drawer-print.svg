<svg xmlns="http://www.w3.org/2000/svg" width="132" height="132" viewBox="0 0 132 132">
  <!-- One tile of the recipe box's printed lining: a whisk, a wheat stalk and a strawberry,
       in the same line style as the app icons, a shade darker than the box. -->
  <g fill="none" stroke="#c29468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- whisk -->
    <g transform="translate(10 8) rotate(-14 12 12)">
      <path d="M12 21v-6"/>
      <path d="M12 15c-3.5 0-5-3-5-6.5S9 3 12 3s5 2 5 5.5S15.5 15 12 15z"/>
      <path d="M12 15c-1.3 0-2-3-2-6.5S11 3 12 3s2 2 2 5.5-.7 6.5-2 6.5z"/>
    </g>
    <!-- strawberry -->
    <g transform="translate(78 30) rotate(10 12 12)">
      <path d="M12 8c4 0 7 1.5 7 4.5 0 4-3.5 8-7 8.5-3.5-.5-7-4.5-7-8.5C5 9.5 8 8 12 8z"/>
      <path d="M8.5 8.5L12 5l3.5 3.5M12 5V2.5"/>
      <path d="M9.5 12.5h.01M14.5 12.5h.01M12 15.5h.01" stroke-width="2.4"/>
    </g>
    <!-- wheat -->
    <g transform="translate(34 78) rotate(16 12 12)">
      <path d="M12 23V6"/>
      <path d="M12 9c-2-1-3-3-3-5.5 2 1 3 3 3 5.5zM12 9c2-1 3-3 3-5.5-2 1-3 3-3 5.5z"/>
      <path d="M12 14c-2-1-3-3-3-5.5 2 1 3 3 3 5.5zM12 14c2-1 3-3 3-5.5-2 1-3 3-3 5.5z"/>
      <path d="M12 19c-2-1-3-3-3-5.5 2 1 3 3 3 5.5zM12 19c2-1 3-3 3-5.5-2 1-3 3-3 5.5z"/>
    </g>
    <!-- small dots to fill the gaps -->
    <path d="M60 14h.01M114 96h.01M96 118h.01M8 64h.01" stroke-width="3"/>
  </g>
</svg>
